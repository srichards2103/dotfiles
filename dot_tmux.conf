bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r w run-shell "tmux neww ~/.local/bin/tmux-windowizer"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
set -g mouse on
set-window-option -g mode-keys vi
set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 50000
# Near-zero ESC delay: the 500ms default makes leaving insert mode in Neovim
# (and any escape-prefixed key) feel laggy. 10ms is enough to disambiguate.
set -sg escape-time 10
# Advertise cursor-shape support (Ss/Se) to programs inside tmux so Neovim's
# guicursor blink reaches the terminal via DECSCUSR.
set -as terminal-features ',xterm*:cstyle'
# Advertise 24-bit truecolor (RGB) for the outer terminal (Ghostty = xterm-ghostty)
# so Neovim's termguicolors output isn't downsampled to 256 colors inside tmux.
set -as terminal-features ',xterm*:RGB'
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# Pipe mouse selections to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Also pipe keyboard-based selections to clipboard
bind -T copy-mode-vi M-w send -X copy-pipe-and-cancel "pbcopy"

# vim-tmux-navigator: seamless C-h/j/k/l between tmux panes and nvim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Repeatable pane resize: prefix + H/J/K/L, hold-to-repeat within repeat-time
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
